<script>
// ─── Cursor viewfinder ─────────────────────────────────────────
(function() {
  const finePointer = window.matchMedia('(pointer: fine) and (hover: hover)');
  const cursor = document.getElementById('cursor-viewfinder');
  if (!cursor || !finePointer.matches) return;

  const label = cursor.querySelector('.cursor-label');
  const interactiveSelector = 'a, button, [role="button"], input, select, textarea, label, [data-cursor]';
  const pointer = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
  const current = { x: pointer.x, y: pointer.y, w: 20, h: 20 };
  const target = { x: pointer.x, y: pointer.y, w: 20, h: 20 };
  let activeEl = null;
  let rafId = null;

  const clamp = (value, min, max) => Math.max(min, Math.min(max, value));

  const shortText = (value) => {
    if (!value) return '';
    return value.replace(/\s+/g, ' ').trim().split(' ').slice(0, 3).join(' ').slice(0, 18);
  };

  const getLabel = (el) => {
    if (!el) return '';
    return shortText(el.dataset.cursor || el.getAttribute('aria-label') || el.textContent);
  };

  const pulse = () => {
    cursor.classList.remove('locking');
    void cursor.offsetWidth;
    cursor.classList.add('locking');
    window.setTimeout(() => cursor.classList.remove('locking'), 440);
  };

  const setActive = (el) => {
    if (el === activeEl) return;
    activeEl = el;
    const text = getLabel(el);
    label.textContent = text;
    cursor.classList.toggle('has-label', Boolean(text));
    if (el) pulse();
  };

  const updateTarget = () => {
    if (activeEl && document.documentElement.contains(activeEl)) {
      const rect = activeEl.getBoundingClientRect();
      const padX = clamp(rect.width * 0.12, 8, 22);
      const padY = clamp(rect.height * 0.22, 7, 16);
      target.x = rect.left + rect.width / 2;
      target.y = rect.top + rect.height / 2;
      target.w = Math.max(20, rect.width + padX);
      target.h = Math.max(20, rect.height + padY);
    } else {
      target.x = pointer.x;
      target.y = pointer.y;
      target.w = 20;
      target.h = 20;
    }
  };

  const animate = () => {
    updateTarget();
    const lock = Boolean(activeEl);
    const speed = lock ? 0.24 : 0.32;
    current.x += (target.x - current.x) * speed;
    current.y += (target.y - current.y) * speed;
    current.w += (target.w - current.w) * 0.22;
    current.h += (target.h - current.h) * 0.22;

    cursor.style.width = current.w + 'px';
    cursor.style.height = current.h + 'px';
    cursor.style.transform = `translate3d(${current.x - current.w / 2}px, ${current.y - current.h / 2}px, 0)`;
    rafId = requestAnimationFrame(animate);
  };

  document.addEventListener('pointermove', (e) => {
    pointer.x = e.clientX;
    pointer.y = e.clientY;
    cursor.classList.add('visible');
    setActive(e.target.closest(interactiveSelector));
  }, { passive: true });

  document.addEventListener('pointerover', (e) => setActive(e.target.closest(interactiveSelector)), { passive: true });
  document.addEventListener('pointerout', (e) => {
    if (activeEl && (!e.relatedTarget || !activeEl.contains(e.relatedTarget))) {
      setActive(null);
    }
  }, { passive: true });
  document.addEventListener('pointerleave', () => { cursor.classList.remove('visible'); setActive(null); }, { passive: true });
  document.addEventListener('pointerdown', () => cursor.classList.add('clicking'), { passive: true });
  document.addEventListener('pointerup', () => cursor.classList.remove('clicking'), { passive: true });
  window.addEventListener('blur', () => { cursor.classList.remove('visible', 'clicking'); setActive(null); });

  animate();

  finePointer.addEventListener?.('change', (e) => {
    if (!e.matches && rafId) cancelAnimationFrame(rafId);
  });
})();

// ─── Magnetic CTA buttons (scoped via [data-magnetic]) ────────
(function() {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  if (!window.matchMedia('(pointer: fine) and (hover: hover)').matches) return;
  const STRENGTH = 0.35;
  const RADIUS = 80;
  let active = null;

  const reset = (el) => {
    el.style.transform = 'translate(0, 0)';
    el.style.transition = 'transform 0.5s cubic-bezier(0.34,1.56,0.64,1)';
  };

  document.addEventListener('mousemove', (e) => {
    const el = e.target.closest ? e.target.closest('[data-magnetic]') : null;
    if (el) {
      const rect = el.getBoundingClientRect();
      const dx = e.clientX - (rect.left + rect.width / 2);
      const dy = e.clientY - (rect.top + rect.height / 2);
      if (Math.sqrt(dx * dx + dy * dy) < RADIUS) {
        if (active && active !== el) reset(active);
        active = el;
        el.style.transform = `translate(${dx * STRENGTH}px, ${dy * STRENGTH}px)`;
        el.style.transition = 'transform 0.15s ease';
        return;
      }
    }
    if (active) { reset(active); active = null; }
  }, { passive: true });
})();

// ─── Page transition ───────────────────────────────────────────
window.qmTransition = function(callback) {
  const overlay = document.getElementById('page-transition');
  overlay.style.transition = 'opacity 0.25s ease';
  overlay.style.opacity = '1';
  overlay.style.pointerEvents = 'all';
  setTimeout(() => {
    callback();
    setTimeout(() => {
      overlay.style.opacity = '0';
      overlay.style.pointerEvents = 'none';
    }, 80);
  }, 250);
};
</script>

<script type="text/babel">

const useReveal = () => {
  React.useEffect(() => {
    const els = document.querySelectorAll('.reveal');
    const obs = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target); } });
    }, { threshold: 0.12 });
    els.forEach(el => obs.observe(el));
    return () => obs.disconnect();
  });
};

// ─── Reusable Film Strip ───────────────────────────────────────
const FilmStrip = ({ images, id, direction = 'left', speed = 1.4, label = 'quiet media film still' }) => {
  const trackRef = React.useRef(null);
  const animRef = React.useRef(null);
  const posRef = React.useRef(0);
  const dragging = React.useRef(false);
  const dragStartX = React.useRef(0);
  const dragStartPos = React.useRef(0);
  const isPaused = React.useRef(false);
  const stripRef = React.useRef(null);
  const [lightboxIndex, setLightboxIndex] = React.useState(null);
  const GAP = 6;

  // Check current theme for mask
  const isDark = () => document.documentElement.getAttribute('data-theme') !== 'light';

  React.useEffect(() => {
    const track = trackRef.current;
    if (!track) return;
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const tick = () => {
      if (!isPaused.current && !dragging.current) {
        const half = track.scrollWidth / 2;
        if (direction === 'left') {
          posRef.current += speed;
          if (posRef.current >= half) posRef.current = 0;
        } else {
          posRef.current -= speed;
          if (posRef.current <= 0) posRef.current = half;
        }
        track.style.transform = `translateX(${-posRef.current}px)`;
      }
      animRef.current = requestAnimationFrame(tick);
    };
    animRef.current = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(animRef.current);
  }, [direction, speed]);

  React.useEffect(() => {
    const el = stripRef.current;
    if (!el) return;
    const onWheel = (e) => {
      if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) {
        e.preventDefault();
        const track = trackRef.current;
        const half = track.scrollWidth / 2;
        let next = posRef.current + e.deltaX;
        if (next < 0) next = 0;
        if (next >= half) next = half - 1;
        posRef.current = next;
        track.style.transform = `translateX(${-posRef.current}px)`;
      }
    };
    el.addEventListener('wheel', onWheel, { passive: false });
    return () => el.removeEventListener('wheel', onWheel);
  }, []);

  // Update mask when theme changes
  React.useEffect(() => {
    const updateMask = () => {
      const el = stripRef.current;
      if (!el) return;
      if (isDark()) {
        el.style.maskImage = 'radial-gradient(ellipse 80% 100% at 50% 50%, black 40%, transparent 100%)';
        el.style.WebkitMaskImage = 'radial-gradient(ellipse 80% 100% at 50% 50%, black 40%, transparent 100%)';
      } else {
        el.style.maskImage = 'none';
        el.style.WebkitMaskImage = 'none';
      }
    };
    updateMask();
    const obs = new MutationObserver(updateMask);
    obs.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
    return () => obs.disconnect();
  }, []);

  const onMouseEnter = () => { isPaused.current = true; };
  const onMouseLeave = () => { if (!dragging.current) isPaused.current = false; };
  const onMouseDown = (e) => { dragging.current = true; dragStartX.current = e.clientX; dragStartPos.current = posRef.current; e.preventDefault(); };
  const onMouseMove = (e) => {
    if (!dragging.current) return;
    const delta = dragStartX.current - e.clientX;
    const track = trackRef.current;
    const half = track.scrollWidth / 2;
    let next = dragStartPos.current + delta;
    if (next < 0) next = 0;
    if (next >= half) next = half - 1;
    posRef.current = next;
    track.style.transform = `translateX(${-posRef.current}px)`;
  };
  const onMouseUp = () => { dragging.current = false; };

  const openLightbox = (index) => { setLightboxIndex(index); document.body.style.overflow = 'hidden'; };
  const closeLightbox = () => { setLightboxIndex(null); document.body.style.overflow = ''; isPaused.current = false; };
  const prevImage = (e) => { e.stopPropagation(); setLightboxIndex(i => (i - 1 + images.length) % images.length); };
  const nextImage = (e) => { e.stopPropagation(); setLightboxIndex(i => (i + 1) % images.length); };

  React.useEffect(() => {
    if (lightboxIndex === null) return;
    const onKey = (e) => {
      if (e.key === 'ArrowRight') setLightboxIndex(i => (i + 1) % images.length);
      if (e.key === 'ArrowLeft') setLightboxIndex(i => (i - 1 + images.length) % images.length);
      if (e.key === 'Escape') closeLightbox();
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [lightboxIndex]);

  React.useEffect(() => {
    const root = document.getElementById('root');
    if (!root) return;
    if (lightboxIndex !== null) {
      root.style.filter = 'blur(14px)';
      root.style.transform = 'scale(0.97)';
      root.style.transition = 'filter 0.4s ease, transform 0.4s ease';
    } else {
      root.style.filter = '';
      root.style.transform = '';
    }
  }, [lightboxIndex]);

  const Lightbox = () => createPortal(
    <div onClick={closeLightbox} style={{
      position: 'fixed', inset: 0, zIndex: 9999,
      background: 'rgba(0,0,0,0.4)',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      padding: '40px', animation: 'fadeIn 0.35s ease',

        fontSize: '13px', fontWeight: 500, letterSpacing: '0.2em',
        textTransform: 'uppercase', cursor: 'inherit',
        opacity: 0.5, fontFamily: "'DM Sans', sans-serif", transition: 'opacity 0.2s',
      }}
        onMouseEnter={e => e.currentTarget.style.opacity = '1'}
        onMouseLeave={e => e.currentTarget.style.opacity = '0.5'}
      >ESC</button>
      <div style={{
        position: 'absolute', top: '28px', left: '50%', transform: 'translateX(-50%)',
        fontSize: '11px', fontWeight: 500, letterSpacing: '0.22em',
        color: 'rgba(255,255,255,0.5)', fontFamily: "'DM Sans', sans-serif",
      }}>{lightboxIndex + 1} / {images.length}</div>
      <button onClick={prevImage} style={{
        position: 'absolute', left: '24px', top: '50%', transform: 'translateY(-50%)',
        background: 'none', border: '1px solid rgba(255,255,255,0.2)',
        color: 'rgba(255,255,255,0.6)', width: '44px', height: '44px',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        cursor: 'inherit', transition: 'border-color 0.2s, color 0.2s', fontSize: '16px',
      }}
        onMouseEnter={e => { e.currentTarget.style.borderColor = 'rgba(255,255,255,0.6)'; e.currentTarget.style.color = '#fff'; }}
        onMouseLeave={e => { e.currentTarget.style.borderColor = 'rgba(255,255,255,0.2)'; e.currentTarget.style.color = 'rgba(255,255,255,0.6)'; }}
      >←</button>
      <div onClick={e => e.stopPropagation()} style={{
        width: '100%', maxWidth: '1100px', aspectRatio: '2.39 / 1',
        overflow: 'hidden', boxShadow: '0 0 0 1px rgba(0,0,0,0.4)',
      }}>
        <img key={lightboxIndex} src={images[lightboxIndex]}
          alt={`${label} still ${lightboxIndex + 1}`}
          style={{ width: '100%', height: '100%', objectFit: 'cover', display: 'block', animation: 'fadeIn 0.3s ease' }}
        />
      </div>
      <button onClick={nextImage} style={{
        position: 'absolute', right: '24px', top: '50%', transform: 'translateY(-50%)',
        background: 'none', border: '1px solid rgba(255,255,255,0.2)',
        color: 'rgba(255,255,255,0.6)', width: '44px', height: '44px',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        cursor: 'inherit', transition: 'border-color 0.2s, color 0.2s', fontSize: '16px',
      }}

        onMouseLeave={e => { e.currentTarget.style.borderColor = 'rgba(255,255,255,0.2)'; e.currentTarget.style.color = 'rgba(255,255,255,0.6)'; }}
      >→</button>
      <div style={{
        position: 'absolute', bottom: '28px', left: '50%', transform: 'translateX(-50%)',

            cursor: 'inherit', transition: 'all 0.3s ease',
          }} />
        ))}
      </div>
    </div>,
    document.body
  );

  return (
    <>
      <div ref={stripRef} style={{
        overflow: 'hidden', width: '100%', margin: '40px 0',
        cursor: 'inherit', userSelect: 'none',
      }}

// ─── Stats Strip ──────────────────────────────────────────────
const StatsStrip = () => {
  const ref = React.useRef(null);
  const [visible, setVisible] = React.useState(false);

  React.useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(([entry]) => {
      if (entry.isIntersecting) { setVisible(true); obs.disconnect(); }
    }, { threshold: 0.3 });
    obs.observe(el);
    return () => obs.disconnect();
  }, []);

  const useCounter = (target, duration, active) => {
    const [count, setCount] = React.useState(0);
    React.useEffect(() => {
      if (!active) return;
      const isNumeric = /^\d+/.test(target);
      if (!isNumeric) return;
      const end = parseInt(target.replace(/\D/g, ''));
      let start = 0;
      const steps = 60;
      const increment = end / steps;
      const timer = setInterval(() => {
        start += increment;
        if (start >= end) { setCount(end); clearInterval(timer); }
        else { setCount(Math.floor(start)); }
      }, (duration * 1000) / steps);
      return () => clearInterval(timer);
    }, [active, target, duration]);
    return count;
  };

  const StatItem = ({ stat, index, visible }) => {
    const isNumeric = /^\d+/.test(stat.number);
    const suffix = isNumeric ? stat.number.replace(/^[\d,]+/, '') : '';
    const count = useCounter(stat.number, 1.8, visible);
    return (
      <div className={`stat-item${visible ? ' visible' : ''}`} style={{
        padding: 'clamp(20px,3vw,32px)',
        borderLeft: index > 0 ? '1px solid rgba(10,10,10,0.08)' : 'none',
        display: 'flex', flexDirection: 'column', gap: '8px',
      }}>
        <span style={{ fontSize: 'clamp(22px,3vw,36px)', fontWeight: 300, letterSpacing: '-0.02em', color: '#0A0A0A', lineHeight: 1 }}>
          {isNumeric ? `${count}${suffix}` : stat.number}
        </span>
        <span style={{ fontSize: '11px', fontWeight: 400, letterSpacing: '0.08em', color: 'rgba(10,10,10,0.4)', lineHeight: 1.4, textTransform: 'uppercase' }}>{stat.label}</span>
      </div>
    );
  };

  const stats = [
    { number: '15M+', label: 'Online views generated' },
    { number: '100k+', label: 'Live audience' },
    { number: '5', label: 'Major streaming platforms' },
    { number: '40+', label: 'Clients worldwide' },
    { number: 'Multi-million', label: 'Pound impact for clients' },
  ];

  return (
    <section ref={ref} style={{
      background: '#EDECE8', borderTop: '1px solid rgba(10,10,10,0.08)', borderBottom: '1px solid rgba(10,10,10,0.08)',
      padding: 'clamp(48px,7vw,88px) clamp(24px,5vw,80px)',

      <section style={{ padding: 'clamp(64px,8vw,120px) clamp(24px,5vw,80px)', display: 'flex', flexDirection: 'column', gap: '2px' }}>
        {members.map((m, i) => (
          <div key={m.name} className="reveal two-col-grid" style={{ alignItems: 'start', padding: 'clamp(40px,5vw,64px) 0', borderBottom: i < members.length - 1 ? '1px solid rgba(var(--fg-rgb),0.06)' : 'none' }}>
            <div style={{ aspectRatio: '4/5', overflow: 'hidden', order: i % 2 === 1 ? 1 : 0 }}>
              <img src={m.src} alt={m.name} loading="lazy" decoding="async" style={{ width: '100%', height: '100%', objectFit: 'cover', objectPosition: 'center top', display: 'block' }} />
            </div>
            <div style={{ order: i % 2 === 1 ? 0 : 1, paddingTop: '8px' }}>
              <p style={{ fontSize: '9px', fontWeight: 500, letterSpacing: '0.24em', textTransform: 'uppercase', color: 'rgba(var(--fg-rgb),0.25)', marginBottom: '14px' }}>{m.role}</p>
              <h2 style={{ fontSize: 'clamp(32px,4vw,52px)', fontWeight: 300, color: 'var(--fg-primary)', letterSpacing: '-0.025em', lineHeight: 1.05, marginBottom: '24px' }}>{m.name}</h2>
              <p style={{ fontSize: '15px', fontWeight: 300, color: 'rgba(var(--fg-rgb),0.5)', lineHeight: 1.85, marginBottom: '20px', textWrap: 'pretty' }}>{m.bio}</p>
              <p style={{ fontSize: '13px', fontWeight: 300, color: 'rgba(var(--fg-rgb),0.3)', lineHeight: 1.8, textWrap: 'pretty' }}>{m.detail}</p>
            </div>
          </div>
        ))}
      </section>
      <section style={{ background: '#EDECE8', padding: 'clamp(64px,8vw,100px) clamp(24px,5vw,80px)' }}>
        <div className="reveal" style={{ maxWidth: '560px' }}>
          <p style={{ fontSize: '10px', fontWeight: 500, letterSpacing: '0.26em', textTransform: 'uppercase', color: 'rgba(10,10,10,0.35)', marginBottom: '20px' }}>WORK WITH US</p>
          <h2 style={{ fontSize: 'clamp(26px,4vw,44px)', fontWeight: 300, letterSpacing: '-0.025em', color: '#0A0A0A', lineHeight: 1.1, marginBottom: '24px', textWrap: 'pretty' }}>Ready to start a conversation?</h2>
          <p style={{ fontSize: '15px', fontWeight: 300, color: 'rgba(10,10,10,0.45)', lineHeight: 1.8, marginBottom: '32px', textWrap: 'pretty' }}>
            Book a free 30-minute intro call. We'll talk about your project and see if we're the right fit.
          </p>
          <button onClick={onBook} data-cursor="book" data-magnetic style={{ fontSize: '10px', fontWeight: 500, letterSpacing: '0.24em', textTransform: 'uppercase', color: '#fff', background: '#0A0A0A', border: 'none', padding: '16px 36px', cursor: 'inherit', transition: 'opacity 0.2s' }}
            onMouseEnter={e => e.currentTarget.style.opacity = '0.8'}
            onMouseLeave={e => e.currentTarget.style.opacity = '1'}
          >BOOK AN INTRO CALL</button>
        </div>
      </section>
    </div>
  );
};

// ─── App ──────────────────────────────────────────────────────
const App = () => {
  const [page, setPage] = React.useState(() => sessionStorage.getItem('qm_page') || 'home');
  const [bookingOpen, setBookingOpen] = React.useState(false);
  const [theme, setTheme] = React.useState(() => localStorage.getItem('qm_theme') || 'dark');

  const toggleTheme = () => {
    const next = theme === 'dark' ? 'light' : 'dark';
    setTheme(next); localStorage.setItem('qm_theme', next);
    document.documentElement.setAttribute('data-theme', next);
  };

  const navigate = (p) => {
    if (p === 'book') { setBookingOpen(true); return; }
    window.qmTransition(() => {
      setPage(p);
      sessionStorage.setItem('qm_page', p);
      window.scrollTo({ top: 0 });
    });
  };

  const openBook = () => setBookingOpen(true);

  return (
    <>
      <QMHeader currentPage={page} onNavigate={navigate} theme={theme} onToggleTheme={toggleTheme} />
      <main style={{ paddingTop: page === 'home' ? '0' : '68px' }}>
        {page === 'home' && (
          <>
            <HeroSection onBook={openBook} />
            <ClientStrips />
            <StatsStrip />
            <AboutSection />
            <ServicesSection />
            <PortfolioSection onNavigate={navigate} />
            <PullQuoteStrip />
            <TeamPreviewSection onNavigate={navigate} />
            <BookingCTASection onBook={openBook} />
          </>
        )}
        {page === 'work' && (
          <>
            <section style={{ padding: 'clamp(100px,12vw,160px) clamp(24px,5vw,80px) clamp(40px,5vw,64px)', borderBottom: '1px solid rgba(var(--fg-rgb),0.06)' }}>
              <p style={{ fontSize: '10px', fontWeight: 500, letterSpacing: '0.28em', textTransform: 'uppercase', color: 'rgba(var(--fg-rgb),0.28)', marginBottom: '20px' }}>OUR WORK</p>
              <h1 style={{ fontSize: 'clamp(40px,7vw,88px)', fontWeight: 300, letterSpacing: '-0.025em', color: 'var(--fg-primary)', lineHeight: 1.0 }}>Selected projects.</h1>
            </section>
            <PortfolioSection onNavigate={navigate} />
            <BookingCTASection onBook={openBook} />
          </>
        )}
        {page === 'about' && (
          <>
            <section style={{ padding: 'clamp(100px,12vw,160px) clamp(24px,5vw,80px) clamp(40px,5vw,64px)', borderBottom: '1px solid rgba(var(--fg-rgb),0.06)' }}>
              <p style={{ fontSize: '10px', fontWeight: 500, letterSpacing: '0.28em', textTransform: 'uppercase', color: 'rgba(var(--fg-rgb),0.28)', marginBottom: '20px' }}>ABOUT</p>
              <h1 style={{ fontSize: 'clamp(40px,7vw,88px)', fontWeight: 300, letterSpacing: '-0.025em', color: 'var(--fg-primary)', lineHeight: 1.0 }}>Who we are.</h1>
            </section>
            <AboutSection />
            <ServicesSection />
            <BookingCTASection onBook={openBook} />
          </>
        )}
        {page === 'case-studies' && (
          <>
            <section style={{ padding: 'clamp(100px,12vw,160px) clamp(24px,5vw,80px) clamp(40px,5vw,64px)', borderBottom: '1px solid rgba(var(--fg-rgb),0.06)' }}>
              <p style={{ fontSize: '10px', fontWeight: 500, letterSpacing: '0.28em', textTransform: 'uppercase', color: 'rgba(var(--fg-rgb),0.28)', marginBottom: '20px' }}>CASE STUDIES</p>
              <h1 style={{ fontSize: 'clamp(40px,7vw,88px)', fontWeight: 300, letterSpacing: '-0.025em', color: 'var(--fg-primary)', lineHeight: 1.0 }}>The work,<br />in detail.</h1>
            </section>
            <CaseStudiesSection onNavigate={navigate} hideHeader />
            <BookingCTASection onBook={openBook} />
          </>
        )}
        {page === 'team' && <TeamPage onNavigate={navigate} onBook={openBook} />}
        {page === 'case-study-soul' && <CaseStudySoulPage onNavigate={navigate} onBook={openBook} />}
        {page === 'case-study-lttl' && <CaseStudyLTTLPage onNavigate={navigate} onBook={openBook} />}
        {page === 'case-study-sophie-conran' && <CaseStudySophieConranPage onNavigate={navigate} onBook={openBook} />}
      </main>
      <QMFooter onNavigate={navigate} />
      <BookingModal isOpen={bookingOpen} onClose={() => setBookingOpen(false)} />
    </>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
