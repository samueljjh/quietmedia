// Q Mark component — uses CSS mask-image so color is controllable via the color prop
const QMark = ({ size = 22, color = 'var(--fg-primary)', style = {} }) => {
  const px = typeof size === 'number' ? `${size}px` : size;
  return (
    <div style={{
      width: px, height: px,
      background: color,
      maskImage: 'url(assets/logo.svg)',
      WebkitMaskImage: 'url(assets/logo.svg)',
      maskSize: 'contain',
      WebkitMaskSize: 'contain',
      maskRepeat: 'no-repeat',
      WebkitMaskRepeat: 'no-repeat',
      maskPosition: 'center',
      WebkitMaskPosition: 'center',
      display: 'block', flexShrink: 0,
      ...style,
    }} />
  );
};
Object.assign(window, { QMark });
</script>

// Reveal hook — wires up IntersectionObserver for .reveal elements
const useReveal = () => {
  React.useEffect(() => {
    const els = document.querySelectorAll('.reveal');
    const obs = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target); } });
    }, { threshold: 0.12 });
    els.forEach(el => obs.observe(el));
    return () => obs.disconnect();
  });
};

            <div style={{ aspectRatio: '4/5', overflow: 'hidden', order: i % 2 === 1 ? 1 : 0 }}>
              <img src={m.src} alt={m.name} style={{ width: '100%', height: '100%', objectFit: 'cover', objectPosition: 'center top', display: 'block' }} />
            </div>

            <div style={{ order: i % 2 === 1 ? 0 : 1, paddingTop: '8px' }}>
              <p style={{ fontSize: '9px', fontWeight: 500, letterSpacing: '0.24em', textTransform: 'uppercase', color: 'rgba(var(--fg-rgb),0.25)', marginBottom: '14px' }}>{m.role}</p>
              <h2 style={{ fontSize: 'clamp(32px,4vw,52px)', fontWeight: 300, color: 'var(--fg-primary)', letterSpacing: '-0.025em', lineHeight: 1.05, marginBottom: '24px' }}>{m.name}</h2>
              <p style={{ fontSize: '15px', fontWeight: 300, color: 'rgba(var(--fg-rgb),0.5)', lineHeight: 1.85, marginBottom: '20px', textWrap: 'pretty' }}>{m.bio}</p>
              <p style={{ fontSize: '13px', fontWeight: 300, color: 'rgba(var(--fg-rgb),0.3)', lineHeight: 1.8, textWrap: 'pretty' }}>{m.detail}</p>
            </div>
          </div>
        ))}
      </section>

      {/* Cream CTA — hardcoded, constant across themes */}
      <section style={{ background: '#EDECE8', padding: 'clamp(64px,8vw,100px) clamp(24px,5vw,80px)' }}>
        <div className="reveal" style={{ maxWidth: '560px' }}>
          <p style={{ fontSize: '10px', fontWeight: 500, letterSpacing: '0.26em', textTransform: 'uppercase', color: 'rgba(10,10,10,0.35)', marginBottom: '20px' }}>WORK WITH US</p>
          <h2 style={{ fontSize: 'clamp(26px,4vw,44px)', fontWeight: 300, letterSpacing: '-0.025em', color: '#0A0A0A', lineHeight: 1.1, marginBottom: '24px', textWrap: 'pretty' }}>
            Ready to start a conversation?
          </h2>
          <p style={{ fontSize: '15px', fontWeight: 300, color: 'rgba(10,10,10,0.45)', lineHeight: 1.8, marginBottom: '32px', textWrap: 'pretty' }}>
            Book a free 30-minute intro call. We'll talk about your project and see if we're the right fit.
          </p>
          <button onClick={onBook} style={{
            fontSize: '10px', fontWeight: 500, letterSpacing: '0.24em', textTransform: 'uppercase',
            color: '#fff', background: '#0A0A0A', border: 'none',
            padding: '16px 36px', cursor: 'pointer', transition: 'opacity 0.2s',
          }}
            onMouseEnter={e => e.currentTarget.style.opacity = '0.8'}
            onMouseLeave={e => e.currentTarget.style.opacity = '1'}
          >BOOK AN INTRO CALL</button>
        </div>
      </section>
    </div>
  );
};

// ─── App ──────────────────────────────────────────────────────
const App = () => {
  const [page, setPage] = React.useState(() => sessionStorage.getItem('qm_page') || 'home');
  const [bookingOpen, setBookingOpen] = React.useState(false);
  const [theme, setTheme] = React.useState(() => localStorage.getItem('qm_theme') || 'dark');

  const toggleTheme = () => {
    const next = theme === 'dark' ? 'light' : 'dark';
    setTheme(next);
    localStorage.setItem('qm_theme', next);
    document.documentElement.setAttribute('data-theme', next);
  };

  const navigate = (p) => {
    if (p === 'book') { setBookingOpen(true); return; }
    setPage(p);
    sessionStorage.setItem('qm_page', p);
    window.scrollTo({ top: 0 });
  };

  const openBook = () => setBookingOpen(true);

  return (
    <>
      <QMHeader currentPage={page} onNavigate={navigate} theme={theme} onToggleTheme={toggleTheme} />
      <main style={{ paddingTop: page === 'home' ? '0' : '68px' }}>
        {page === 'home' && (
          <>
            <HeroSection onBook={openBook} />
            <AboutSection />
            <ServicesSection />
            <PortfolioSection />
            <TeamPreviewSection onNavigate={navigate} />
            <BookingCTASection onBook={openBook} />
          </>
        )}
        {page === 'work' && (
          <>
            <section style={{ padding: 'clamp(100px,12vw,160px) clamp(24px,5vw,80px) clamp(40px,5vw,64px)', borderBottom: '1px solid rgba(var(--fg-rgb),0.06)' }}>
              <p style={{ fontSize: '10px', fontWeight: 500, letterSpacing: '0.28em', textTransform: 'uppercase', color: 'rgba(var(--fg-rgb),0.28)', marginBottom: '20px' }}>OUR WORK</p>
              <h1 style={{ fontSize: 'clamp(40px,7vw,88px)', fontWeight: 300, letterSpacing: '-0.025em', color: 'var(--fg-primary)', lineHeight: 1.0 }}>Selected projects.</h1>
            </section>
            <PortfolioSection />
            <BookingCTASection onBook={openBook} />
          </>
        )}
        {page === 'about' && (
          <>
            <section style={{ padding: 'clamp(100px,12vw,160px) clamp(24px,5vw,80px) clamp(40px,5vw,64px)', borderBottom: '1px solid rgba(var(--fg-rgb),0.06)' }}>
              <p style={{ fontSize: '10px', fontWeight: 500, letterSpacing: '0.28em', textTransform: 'uppercase', color: 'rgba(var(--fg-rgb),0.28)', marginBottom: '20px' }}>ABOUT</p>
              <h1 style={{ fontSize: 'clamp(40px,7vw,88px)', fontWeight: 300, letterSpacing: '-0.025em', color: 'var(--fg-primary)', lineHeight: 1.0 }}>Who we are.</h1>
            </section>
            <AboutSection />
            <ServicesSection />
            <BookingCTASection onBook={openBook} />
          </>
        )}
        {page === 'team' && <TeamPage onNavigate={navigate} onBook={openBook} />}
      </main>
      <QMFooter onNavigate={navigate} />
      <BookingModal isOpen={bookingOpen} onClose={() => setBookingOpen(false)} />
    </>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
